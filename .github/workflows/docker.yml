name: Docker image

# Builds the studio image (Caddy serving the built app) for linux/amd64 and
# linux/arm64 and pushes it to GitHub Packages as ghcr.io/<owner>/bop-studio.
# After CI passes on a push to main: `latest` and `sha-<commit>`. Version tags
# (v*): the version, once CI for that tag passes. Pull requests that touch the
# image build it without pushing.
#
# To publish an existing release tag again:
#   gh workflow run docker.yml -f tag=v0.1.1

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/Caddyfile
      - .github/workflows/docker.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and push, such as v0.1.1. Empty builds the selected branch as latest.
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ inputs.tag || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Tag pushes do not run CI, so run it here before publishing a release image.
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  image:
    name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
    needs: [test]
    # Runs when `test` was skipped (not a tag push) but never after it failed.
    if: >-
      !cancelled() && needs.test.result != 'failure' && (
        github.event_name != 'workflow_run' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      )
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A workflow_run event otherwise checks out the default branch.
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha || github.sha }}
      # Tags released before the Dockerfile built natively need emulation for arm64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Registry names must be lowercase; metadata-action's sha tag would use
      # the default branch head on workflow_run.
      - id: names
        run: |
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bop-studio" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.tag == '') }}
            type=raw,value=sha-${{ steps.names.outputs.short }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
